<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SATS-PI</title>
<meta name="description" content="Recevez des sats du monde, dépensez des FCFA chez vous. Un pont entre Bitcoin Lightning et le mobile money en Afrique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<style>
  /* Or = PI-SPI (mesuré sur ses logos). Orange = Bitcoin. Violet = Lightning (convention, non officiel). */
  :root { --cream:#F5F3E6; --ink:#17130B; --mid:#6F6A58; --line:rgba(23,19,11,.12);
    --gold:#FBB900; --gold-soft:#F6D675; --ln:#792EE5; --btc:#F7931A; --ok:#1F7A3A; --bad:#B3261E;
    --serif:"Fraunces",Georgia,"Times New Roman",serif; --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { scroll-behavior:smooth; scroll-padding-top:84px; -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--cream); color:var(--ink); font:400 16px/1.55 var(--sans); }
  button,input,select { font:inherit; color:inherit; }
  a { color:inherit; }
  :focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  .dark :focus-visible { outline-color:#fff; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 20px; }
  .serif { font-family:var(--serif); font-variation-settings:"SOFT" 40,"opsz" 72; letter-spacing:-.02em; }
  h1,h2,h3 { margin:0; font-family:var(--serif); font-weight:500; letter-spacing:-.02em; line-height:1.08; font-variation-settings:"SOFT" 40,"opsz" 72; }
  h2.title { font-size:44px; } h3 { font-size:24px; }
  p { margin:0; }
  .eyebrow { display:inline-block; margin-bottom:14px; padding:6px 14px; border-radius:999px; background:rgba(23,19,11,.07); font-weight:700; font-size:13px; letter-spacing:.02em; }
  .lead { margin-top:14px; max-width:620px; color:var(--mid); font-size:18px; }

  /* boutons */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:15px 26px; border:0; border-radius:999px; background:var(--ink); color:#fff; font-weight:700; font-size:16px; cursor:pointer; text-decoration:none; box-shadow:0 10px 20px -12px rgba(23,19,11,.7); }
  .btn:hover { background:#2b2415; }
  .btn:disabled { background:rgba(23,19,11,.16); color:rgba(23,19,11,.42); box-shadow:none; cursor:not-allowed; }
  .btn.block { width:100%; }
  .btn.gold { background:var(--gold); color:var(--ink); box-shadow:none; } .btn.gold:hover { background:#ffc61f; }
  .btn.frost { background:rgba(255,255,255,.14); color:#fff; box-shadow:none; } .btn.frost:hover { background:rgba(255,255,255,.24); }
  .btn.ghost { background:#fff; color:var(--ink); border:1.5px solid var(--line); box-shadow:none; } .btn.ghost:hover { background:#faf8ee; }
  .btn.ln { background:var(--ln); box-shadow:0 10px 20px -12px rgba(121,46,229,.8); } .btn.ln:hover { background:#6a22d1; }
  .btn.sm { padding:10px 18px; font-size:14px; }
  .btn svg { width:18px; height:18px; }

  /* navbar */
  .nav { position:sticky; top:0; z-index:50; background:rgba(245,243,230,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .nav .in { display:flex; align-items:center; gap:20px; height:68px; }
  .logo { display:inline-flex; align-items:center; gap:10px; font:600 22px/1 var(--serif); text-decoration:none; letter-spacing:-.01em; }
  .logo .tile { display:grid; place-items:center; width:34px; height:34px; border-radius:11px; background:var(--ink); }
  .logo .tile svg { width:17px; height:17px; }
  .links { display:flex; gap:6px; margin-left:auto; }
  .links a { padding:9px 14px; border-radius:999px; font-weight:600; font-size:15px; text-decoration:none; cursor:pointer; }
  .links a:hover { background:rgba(23,19,11,.07); }
  .navr { display:flex; align-items:center; gap:8px; }
  .av { display:grid; place-items:center; width:38px; height:38px; border-radius:50%; background:var(--gold); font:600 17px/1 var(--serif); }
  .burger { display:none; width:44px; height:44px; border:0; border-radius:50%; background:rgba(23,19,11,.07); cursor:pointer; }
  .burger svg { width:22px; height:22px; }

  /* hero */
  .hero { margin:14px 14px 0; color:#fff; border-radius:40px 40px 0 0; padding:74px 0 250px;
          background:linear-gradient(180deg,#17130B 0,#17130B calc(100% - 340px),#6e520c calc(100% - 260px),#E7BC3C calc(100% - 150px),#F6E7B0 calc(100% - 60px),var(--cream) 100%); }
  .hero .grid { display:grid; grid-template-columns:1.15fr .85fr; gap:48px; align-items:center; }
  .hero h1 { font-size:68px; }
  .hero h1 em { font-style:italic; color:var(--gold); }
  .hero .lead { color:rgba(255,255,255,.84); }
  .hero .cta { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
  .trust { display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:26px; color:rgba(255,255,255,.78); font-size:14px; }
  .trust span::before { content:""; display:inline-block; width:8px; height:8px; margin-right:8px; border-radius:50%; background:var(--gold); }
  .gcard { position:relative; width:100%; max-width:440px; justify-self:end; padding:22px 24px; aspect-ratio:1.62; border-radius:28px; overflow:hidden; color:var(--ink); display:flex; flex-direction:column;
           background:linear-gradient(140deg,#F9E39A 0%,#EDC24A 42%,#B98A10 100%); box-shadow:0 30px 50px -26px rgba(0,0,0,.7); transform:rotate(-3deg); }
  .gcard::after { content:""; position:absolute; inset:0; background:radial-gradient(80% 60% at 20% 0%,rgba(255,255,255,.55),transparent 70%); }
  .gc-top { display:flex; justify-content:space-between; align-items:center; }
  .chipic { width:42px; height:31px; border-radius:8px; background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(120,85,5,.25)); border:1px solid rgba(90,62,0,.35); }
  .gc-mark { display:grid; place-items:center; width:38px; height:38px; border-radius:11px; background:var(--ink); } .gc-mark svg { width:19px; height:19px; }
  .gc-lbl { margin-top:auto; font-weight:600; font-size:15px; color:rgba(23,19,11,.7); }
  .gc-amt { font:500 54px/1 var(--serif); letter-spacing:-.03em; } .gc-amt small { font-size:26px; margin-left:4px; }
  .gc-foot { display:flex; justify-content:space-between; margin-top:12px; font-size:14px; font-weight:600; color:rgba(23,19,11,.78); }
  .chipfloat { position:absolute; z-index:2; padding:10px 16px; border-radius:999px; background:#fff; color:var(--ink); font-weight:700; font-size:14px; box-shadow:0 18px 30px -16px rgba(0,0,0,.6); }
  .herovis { position:relative; }
  .chipfloat.a { left:-10px; top:-26px; } .chipfloat.a b { color:var(--btc); }
  .chipfloat.b { right:0; bottom:-30px; } .chipfloat.b b { color:#a77a00; }

  /* sections */
  section.sec { padding:84px 0; }
  .up { margin-top:-190px; position:relative; padding-top:0; }
  .cards3 { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  .card { padding:28px; border-radius:32px; background:rgba(255,255,255,.94); box-shadow:0 24px 50px -34px rgba(70,55,8,.6); }
  .card .ic { display:grid; place-items:center; width:50px; height:50px; margin-bottom:18px; border-radius:16px; background:var(--ink); color:var(--gold); }
  .card .ic.o { background:var(--btc); color:var(--ink); } .card .ic.g { background:var(--gold); color:var(--ink); } .card .ic.p { background:var(--ln); color:#fff; }
  .card .ic svg { width:24px; height:24px; }
  .card p { margin-top:10px; color:var(--mid); }
  .intro { max-width:760px; margin:0 auto 40px; text-align:center; } .intro .lead { margin-left:auto; margin-right:auto; }

  .steps { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; counter-reset:s; margin-top:44px; position:relative; }
  .step { position:relative; counter-increment:s; padding:26px 22px; border-radius:28px; background:#fff; border:1px solid var(--line); }
  .step::before { content:counter(s); display:grid; place-items:center; width:42px; height:42px; margin-bottom:16px; border-radius:50%; background:var(--c,var(--ink)); color:#fff; font:600 20px/1 var(--serif); }
  .step:nth-child(1){--c:var(--ink)} .step:nth-child(2){--c:var(--ln)} .step:nth-child(3){--c:var(--btc)} .step:nth-child(4){--c:#b98a10}
  .step h3 { font-size:21px; } .step p { margin-top:8px; color:var(--mid); font-size:15px; }
  .band { margin-top:36px; height:6px; border-radius:3px; background:linear-gradient(90deg,var(--ink),var(--ln),var(--btc),var(--gold)); }

  /* demande */
  .ask { display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:start; }
  .askbox { padding:32px; border-radius:36px; background:#fff; box-shadow:0 30px 60px -36px rgba(23,19,11,.55); }
  .askdark { padding:36px; border-radius:36px; color:#fff; background:linear-gradient(160deg,#17130B 55%,#6e520c 140%); }
  .askdark h3 { font-size:30px; } .askdark ul { margin:20px 0 0; padding:0; list-style:none; display:grid; gap:12px; color:rgba(255,255,255,.88); }
  .askdark li::before { content:"✓"; margin-right:10px; color:var(--gold); font-weight:800; }
  .qline { margin-top:26px; padding:18px 20px; border-radius:22px; background:rgba(255,255,255,.1); }
  .qline .big { font:500 40px/1 var(--serif); letter-spacing:-.02em; } .qline .big small { font:600 15px var(--sans); color:rgba(255,255,255,.7); margin-left:6px; }
  .qline p { margin-top:6px; color:rgba(255,255,255,.75); font-size:14px; }
  .chips { display:flex; gap:6px; margin:10px 0 4px; }
  .chip { flex:1; padding:11px 2px; border:1.5px solid var(--line); border-radius:999px; background:#faf8ee; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap; }
  .chip:hover,.chip.on { background:var(--gold-soft); border-color:transparent; }
  .fld { margin-top:16px; } .fld label { display:block; margin-bottom:6px; font-weight:700; font-size:15px; }
  .fld input { width:100%; height:54px; padding:0 18px; border:1.5px solid var(--line); border-radius:18px; background:#faf8ee; font:600 17px/1 var(--sans); }
  .fld input:focus { outline:none; border-color:var(--ink); box-shadow:0 0 0 4px rgba(251,185,0,.35); }
  .pfx { display:flex; gap:8px; } .pfx .code { display:grid; place-items:center; padding:0 16px; border-radius:18px; border:1.5px solid var(--line); background:#faf8ee; font-weight:700; }
  .hint { margin:6px 4px 0; color:var(--mid); font-size:14px; } .hint.bad { color:var(--bad); font-weight:600; }
  .askbox .btn { margin-top:22px; }
  .sel { width:100%; height:54px; padding:0 14px; border:1.5px solid var(--line); border-radius:18px; background:#faf8ee; font:600 17px var(--sans); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  /* faq */
  .faq { max-width:820px; margin:0 auto; display:grid; gap:12px; }
  .faq details { padding:0 24px; border-radius:24px; background:#fff; border:1px solid var(--line); }
  .faq summary { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 0; font:500 20px/1.25 var(--serif); cursor:pointer; list-style:none; }
  .faq summary::-webkit-details-marker { display:none; }
  .faq summary::after { content:"+"; flex:none; display:grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--gold-soft); font:700 20px/1 var(--sans); transition:transform .2s; }
  .faq details[open] summary::after { transform:rotate(45deg); }
  .faq details p { padding:0 0 22px; color:var(--mid); }

  /* cta final + footer */
  .final { margin:0 14px; padding:70px 20px; border-radius:40px; text-align:center; color:#fff; background:linear-gradient(180deg,#17130B,#3b2c07 70%,#7a5a0a); }
  .final h2 { font-size:44px; } .final p { margin:14px auto 0; max-width:520px; color:rgba(255,255,255,.82); }
  .final .cta { margin-top:26px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  footer { padding:56px 0 30px; }
  .fgrid { display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:32px; }
  .fgrid h4 { margin:0 0 12px; font-size:14px; letter-spacing:.04em; text-transform:uppercase; color:var(--mid); }
  .fgrid ul { margin:0; padding:0; list-style:none; display:grid; gap:8px; } .fgrid a { text-decoration:none; font-weight:500; cursor:pointer; } .fgrid a:hover { text-decoration:underline; }
  .fgrid .about { margin-top:12px; color:var(--mid); max-width:300px; font-size:15px; }
  .legal { margin-top:36px; padding-top:20px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; color:var(--mid); font-size:13px; }

  /* auth + pages */
  .page { padding:40px 0 80px; min-height:70vh; }
  .authgrid { display:grid; grid-template-columns:1fr 1fr; gap:24px; max-width:1000px; margin:0 auto; align-items:stretch; }
  .authside { padding:40px; border-radius:36px; color:#fff; display:flex; flex-direction:column; justify-content:flex-end; min-height:440px;
    background:linear-gradient(180deg,#17130B 0,#17130B 40%,#6e520c 75%,#E7BC3C 130%); }
  .authside h2 { font-size:36px; } .authside p { margin-top:12px; color:rgba(255,255,255,.82); }
  .authbox { padding:34px; border-radius:36px; background:#fff; box-shadow:0 30px 60px -36px rgba(23,19,11,.55); }
  .seg { display:flex; padding:4px; margin-bottom:8px; border-radius:999px; background:rgba(23,19,11,.07); }
  .seg button { flex:1; padding:10px; border:0; border-radius:999px; background:transparent; font-weight:700; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.18); }
  .terms { display:flex; gap:12px; align-items:flex-start; margin-top:18px; padding:14px 16px; border-radius:18px; background:#faf8ee; font-size:14.5px; }
  .terms input { flex:none; width:22px; height:22px; margin:2px 0 0; accent-color:var(--ink); }
  .terms a { font-weight:700; }
  .note { margin-top:14px; color:var(--mid); font-size:13px; }
  .prose { max-width:760px; margin:0 auto; padding:34px; border-radius:32px; background:#fff; }
  .prose h1 { font-size:38px; } .prose h3 { margin:26px 0 8px; font-size:22px; } .prose p, .prose li { color:#3b3626; } .prose ul { padding-left:20px; }
  .draft { margin-top:12px; padding:12px 16px; border-radius:16px; background:var(--gold-soft); font-weight:600; font-size:14px; }

  /* page de paiement */
  .paygrid { display:grid; grid-template-columns:1fr 1fr; gap:24px; max-width:1060px; margin:0 auto; align-items:stretch; }
  .payhero { padding:40px; border-radius:40px 40px 0 0; color:#fff; min-height:560px;
    background:linear-gradient(180deg,#17130B 0,#17130B 55%,#6e520c 75%,#E7BC3C 92%,#F6E7B0 100%); }
  .payhero h1 { font-size:36px; } .payhero .amt { margin-top:12px; font:500 90px/1 var(--serif); letter-spacing:-.03em; } .payhero .amt small { font-size:34px; color:rgba(255,255,255,.6); margin-left:8px; }
  .payhero .sub { margin-top:10px; color:rgba(255,255,255,.84); }
  .how { margin:26px 0 0; padding:0; list-style:none; display:grid; gap:12px; counter-reset:h; }
  .how li { display:flex; align-items:center; gap:12px; counter-increment:h; color:rgba(255,255,255,.92); }
  .how li::before { content:counter(h); display:grid; place-items:center; flex:none; width:28px; height:28px; border-radius:50%; background:var(--gold); color:var(--ink); font-weight:800; font-size:14px; }
  .paybox { padding:26px; border-radius:32px; background:#fff; text-align:center; box-shadow:0 30px 60px -34px rgba(23,19,11,.6); }
  .paybox .qr svg { display:block; width:210px; height:210px; margin:0 auto; }
  .qrnote { margin-top:6px; color:var(--mid); font-size:13px; }
  .sats { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:center; gap:4px 12px; margin-top:14px; }
  .sats b { font:500 44px/1 var(--serif); letter-spacing:-.02em; } .badge { padding:4px 12px; border-radius:999px; background:var(--btc); font-weight:800; font-size:15px; } .eur { color:var(--mid); font-weight:600; font-size:18px; }
  .timer { margin-top:14px; text-align:center; color:var(--mid); font-size:14px; font-variant-numeric:tabular-nums; }
  .paycol .btn { width:100%; margin-top:12px; }
  .paycol details { margin-top:16px; } .paycol summary { cursor:pointer; font-weight:700; }
  table { width:100%; margin-top:8px; border-collapse:collapse; font-size:14px; } td { padding:4px 0; } td:last-child { text-align:right; }
  tr.t td { padding-top:7px; border-top:1px solid var(--line); font-weight:700; }
  .banner { max-width:1060px; margin:0 auto 18px; padding:14px 20px; border-radius:22px; background:var(--gold-soft); display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; font-weight:600; }
  .banner .sp { flex:1; }
  .stepsl { margin:0; padding:0; list-style:none; display:grid; gap:16px; text-align:left; }
  .stepsl li { display:flex; align-items:center; gap:12px; color:var(--mid); font-size:17px; }
  .stepsl .d { position:relative; flex:none; width:26px; height:26px; border:3px solid rgba(23,19,11,.15); border-radius:50%; }
  .stepsl li.active { color:var(--ink); font-weight:700; } .stepsl li.active .d { border-color:var(--ink); border-top-color:transparent; animation:spin 1s linear infinite; }
  .stepsl li.done { color:var(--ink); } .stepsl li.done .d { background:var(--ink); border-color:var(--ink); }
  .stepsl li.done .d::after { content:""; position:absolute; left:7px; top:2px; width:6px; height:12px; border:solid #fff; border-width:0 3px 3px 0; transform:rotate(45deg); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .bigcheck { display:grid; place-items:center; width:76px; height:76px; margin-bottom:14px; border-radius:50%; background:var(--gold); }
  .bigcheck svg { width:40px; height:40px; stroke:var(--ink); }
  .toast { position:fixed; left:50%; bottom:24px; z-index:90; transform:translateX(-50%); padding:12px 20px; border-radius:999px; background:var(--ink); color:#fff; font-size:14px; }
  .demo { margin-top:12px; padding:12px; border:2px dashed #6f6a58; border-radius:20px; text-align:center; }
  .demo small { display:block; margin-bottom:8px; color:var(--mid); }

  @media (max-width:959px) {
    h2.title, .final h2 { font-size:34px; }
    .links { display:none; position:absolute; top:68px; left:0; right:0; flex-direction:column; margin:0; padding:10px 20px 18px; background:var(--cream); border-bottom:1px solid var(--line); }
    .links.open { display:flex; } .burger { display:grid; place-items:center; margin-left:auto; } .navr { margin-left:0; } .nav .in { gap:10px; }
    .navr .hide-m { display:none; }
    .hero { margin:8px 8px 0; padding:44px 0 230px; border-radius:32px 32px 0 0; } .hero .grid { grid-template-columns:1fr; gap:36px; } .hero h1 { font-size:44px; }
    .gcard { justify-self:center; transform:rotate(-2deg); } .chipfloat.a { left:0; top:-22px; } .chipfloat.b { right:4px; }
    .up { margin-top:-170px; } .cards3,.steps,.ask,.authgrid,.paygrid { grid-template-columns:1fr; } .fgrid { grid-template-columns:1fr 1fr; }
    section.sec { padding:60px 0; } .askbox,.askdark,.authbox { padding:24px; } .authside { min-height:260px; padding:28px; }
    .payhero { min-height:0; padding:28px 24px 170px; border-radius:32px 32px 0 0; } .payhero .amt { font-size:64px; } .payhero h1 { font-size:30px; }
    .paycol { margin-top:-150px; position:relative; padding:0 6px; } .paybox .qr svg { width:170px; height:170px; }
    .final { margin:0 8px; border-radius:32px; } .hero + .up { }
  }
  @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap in">
    <a class="logo" href="#/" data-nav="home" aria-label="SATS-PI, accueil"><span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="#FBB900"/></svg></span>SATS-PI</a>
    <nav class="links" id="links" aria-label="Navigation principale">
      <a data-go="presentation">Présentation</a><a data-go="comment">Comment ça marche</a><a data-go="demande">Faire une demande</a><a data-go="faq">FAQ</a>
    </nav>
    <div class="navr" id="navr"></div>
    <button class="burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>

<main id="app"></main>
<footer id="foot"></footer>

<script>
/* Démo autonome : tout est simulé dans le navigateur (compte, QR, paiement).
   Branchement sur le backend FastAPI :
   - quote()          -> GET  /api/quote?amount_xof=...
   - création demande -> POST /api/links (compte requis : à ajouter côté serveur)
   - suivi statut     -> GET  /api/links/{id}   toutes les 1,5 s

function quote(a){const s=ceil(a*SERVICE_PCT/100),p=ceil(a*PISPI_PCT/100),t=a+s+p;return{a,s,p,t,sats:ceil(t/RATE*1e8)};}

/* Pays : la réception n'est ouverte que là où la doc FedaPay confirme les payouts mobile money
   (Bénin, Côte d'Ivoire, Togo). Les autres sont affichés « bientôt ». Même liste que GET /api/countries. */
const COUNTRIES=[
  {c:"BJ",n:"Bénin",dial:"229",len:10,ops:["MTN","Moov"],ex:"01 97 12 34 56",ok:true},
  {c:"CI",n:"Côte d'Ivoire",dial:"225",len:10,ops:["MTN"],ex:"07 08 09 10 11",ok:true},

const ctry=(c=S.country)=>COUNTRIES.find(x=>x.c===c)||COUNTRIES[0];
function normPhone(raw,c=ctry()){let d=digits(raw); if(d.startsWith(c.dial)&&d.length>c.len)d=d.slice(c.dial.length);
  if(c.c==="BJ"&&d.length===8)d="01"+d; return d.length===c.len&&(c.c!=="BJ"||d.startsWith("01"))?d:null;}
const mask=(d,c=ctry())=>d.length>=8?`+${c.dial} ${d.slice(0,2)} ${d.slice(2,4)} ** ** ${d.slice(-2)}`:`+${c.dial} ** ${d.slice(-2)}`;
const amt=()=>+S.amount||0, amtOk=()=>amt()>=MIN&&amt()<=MAX;

function makeLink(){
  const q=quote(amt()), id=Array.from(crypto.getRandomValues(new Uint8Array(4)),b=>b.toString(16).padStart(2,"0")).join("");
  S.link={id,...q,country:S.country,operator:S.operator,phone:normPhone(S.phone),name:S.name.trim()||firstName(),last:S.last.trim(),url:`sats-pi.app/l/${id}`,ref:"MOCK-"+id.toUpperCase(),
    invoice:`lnbc${q.sats}n1mock${id}${"q".repeat(36)}`,expires:Date.now()+TTL*1000};
  S.pay="open"; S.phase=0;
}
function qrSvg(seed){
  const N=29;let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296;};
  const fin=(x,y)=>(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);
  const box=(ox,oy)=>`M${ox} ${oy}h7v7h-7zM${ox+1} ${oy+1}h5v5h-5zM${ox+2} ${oy+2}h3v3h-3z`;
  let d=box(0,0)+box(N-7,0)+box(0,N-7);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!fin(x,y)&&rnd()>.52)d+=`M${x} ${y}h1v1h-1z`;
  return `<svg viewBox="-2 -2 ${N+4} ${N+4}" shape-rendering="crispEdges" role="img" aria-label="QR de la facture Lightning (exemple)"><rect x="-2" y="-2" width="${N+4}" height="${N+4}" fill="#fff"/><path d="${d}" fill="#17130B" fill-rule="evenodd"/></svg>`;
}

      <div class="demo"><small>Démonstration</small><button class="btn sm ghost" data-act="simulate">Simuler le paiement de l'expéditeur</button></div>`;
  } else if(S.pay==="processing"){
    hero=`<h1>Paiement reçu.<br>Envoi en cours.</h1><p class="sub">${esc(q.name)} va recevoir ${fmt(q.a)} F sur son mobile money.</p>`;
    col=`<div class="paybox" style="text-align:left"><ul class="stepsl">${stepsList()}</ul></div>`;
  } else if(S.pay==="done"){
    hero=`<span class="bigcheck">${CHECK}</span><h1>Envoyé !</h1><p class="sub">${esc(q.name)} a reçu <strong style="color:#fff">${fmt(q.a)} F</strong> sur son mobile money.</p>`;
    col=`<div class="paybox" style="text-align:left"><p>L'expéditeur a payé <strong>${fmt(q.sats)} sats</strong>, soit environ ${eur(q.t)}, frais compris.</p><p class="hint" style="margin-left:0">Référence ${q.ref}</p></div><button class="btn" data-act="new">Faire une autre demande</button>`;
  } else {
    hero=`<h1>Ce lien a expiré</h1><p class="sub">Le prix en bitcoin n'est plus garanti. Créez une nouvelle demande.</p>`;
    col=`<div class="paybox" style="text-align:left"><p>Aucun paiement n'a été pris.</p></div><button class="btn" data-act="new">Créer une nouvelle demande</button>`;
  }
  return `<div class="page"><div class="wrap">${banner}<div class="paygrid"><section class="payhero dark">${hero}</section><section class="paycol">${col}</section></div></div></div>`;
}
function startTimer(){
  clearInterval(tick);
  const draw=()=>{const left=Math.max(0,Math.round((S.link.expires-Date.now())/1000)),el=$("#timer");
    if(el)el.textContent=`Prix garanti encore ${Math.floor(left/60)} min ${String(left%60).padStart(2,"0")} s`;
    if(left===0){clearInterval(tick);S.pay="expired";route();}};
  draw();tick=setInterval(draw,1000);
}

/* ---------- routage ---------- */
function route(){
  clearInterval(tick);
  const h=(location.hash||"#/").replace("#","");
  const app=$("#app"); renderNav();
  $("#links").classList.remove("open"); $("#burger").setAttribute("aria-expanded","false");
  if(h.startsWith("/connexion")){ app.innerHTML=authHtml(); document.title="Connexion · SATS-PI"; }
  else if(h.startsWith("/conditions")){ app.innerHTML=termsHtml(); document.title="Conditions · SATS-PI"; }
  else if(h.startsWith("/payer")){
    if(!S.user){ S.pending=true; S.mode="login"; location.hash="#/connexion"; return; }
    app.innerHTML=payHtml(); document.title="Paiement · SATS-PI"; if(S.link&&S.pay==="open")startTimer();
  } else { app.innerHTML=homeHtml(); document.title="SATS-PI · Recevez des sats, dépensez des FCFA"; updateQuote(); }
  renderFoot();
  if(!pendingScroll)window.scrollTo(0,0);
  if(pendingScroll){const t=pendingScroll;pendingScroll=null;$("#"+t)?.scrollIntoView();}
}
let pendingScroll=null;
function goSection(id){
  if(((location.hash||"#/")!=="#/")&&(location.hash!=="")){pendingScroll=id;location.hash="#/";}
  else $("#"+id)?.scrollIntoView();
}
function toast(m){$$(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200);}
async function copy(txt,m){try{await navigator.clipboard.writeText(txt);toast(m);}catch(e){toast("Copie impossible : sélectionnez le texte à la main.");}}

function afterAuth(){
  renderNav();
  if(S.pending&&amtOk()&&normPhone(S.phone)&&S.last.trim()){S.pending=false;makeLink();location.hash="#/payer";}
  else{S.pending=false;location.hash="#/";}
}
function submitAsk(){
  if(!(amtOk()&&normPhone(S.phone)&&(S.name||firstName()).trim()&&S.last.trim()))return;
  if(!S.name)S.name=firstName();
  if(!S.user){S.pending=true;S.mode="signup";location.hash="#/connexion";return;}
  makeLink();location.hash="#/payer";
}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault();goSection(g.dataset.go);return;}
  const b=e.target.closest("[data-act]"); if(!b)return; const a=b.dataset.act;
  if(a==="chip"){S.amount=b.dataset.v;$("#f-amt").value=S.amount;updateQuote();}
  else if(a==="signup"){S.mode="signup";location.hash="#/connexion";if(location.hash==="#/connexion")route();}
  else if(a==="login"){S.mode="login";location.hash="#/connexion";if(location.hash==="#/connexion")route();}
  else if(a==="logout"){S.user=null;S.link=null;saveUser();location.hash="#/";route();toast("Vous êtes déconnecté.");}
  else if(a==="mode"){S.mode=b.dataset.m;route();}
  else if(a==="goask")goSection("demande");
  else if(a==="back")history.length>1?history.back():(location.hash="#/");
  else if(a==="copy-link")copy("https://"+S.link.url,"Lien copié");
  else if(a==="copy-inv")copy(S.link.invoice,"Facture copiée");
  else if(a==="wallet")toast("Dans l'application, ceci ouvre votre wallet Lightning.");
  else if(a==="new"){S.link=null;S.pay="open";pendingScroll="demande";location.hash="#/";route();}
  else if(a==="simulate"){S.pay="processing";S.phase=0;route();timers.push(setTimeout(()=>{S.phase=1;route();},1000));timers.push(setTimeout(()=>{S.pay="done";route();},2500));}
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="f-amt"){S.amount=digits(e.target.value).slice(0,7);e.target.value=S.amount;updateQuote();}
  else if(id==="f-name"){S.name=e.target.value;updateQuote();}
  else if(id==="f-last"){S.last=e.target.value;updateQuote();}
  else if(id==="f-phone"){S.phone=e.target.value;updateQuote();}
  else if(id==="f-op"){S.operator=e.target.value;}
  else if(id==="f-country"){S.country=e.target.value;S.operator=ctry().ops[0]||"";S.phone="";$("#f-phone").value="";updateQuote();}
  else if(id==="a-terms"){$("#a-go").disabled=!e.target.checked;}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="ask-form")submitAsk();
  if(e.target.id==="auth-form"){
    const err=$("#a-err"),mail=$("#a-mail").value.trim(),pw=$("#a-pw").value,su=S.mode==="signup",name=su?$("#a-name").value.trim():"";
    if(su&&name.length<2)return void(err.textContent="Indiquez votre nom.");
    if(!/^\S+@\S+\.\S+$/.test(mail))return void(err.textContent="Adresse e-mail invalide.");
    if(pw.length<8)return void(err.textContent="Le mot de passe doit faire au moins 8 caractères.");
    if(su&&!$("#a-terms").checked)return void(err.textContent="Vous devez accepter les conditions pour continuer.");
    S.user={name:su?name:(S.user?.name||mail.split("@")[0]),email:mail,acceptedTerms:su?new Date().toISOString():(S.user?.acceptedTerms||null)};
    if(!S.name)S.name=firstName();
    saveUser();afterAuth();
  }
});
$("#burger").addEventListener("click",()=>{const l=$("#links");l.classList.toggle("open");$("#burger").setAttribute("aria-expanded",l.classList.contains("open"));});
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
